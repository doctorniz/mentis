<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#4c6ef5" />
    <title>Mentis</title>
    <style>
      /* Standalone: no CSS bundle, so the theme tokens are inlined. Follows the
         OS colour scheme, which is at least parity with Next's default 404. */
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #212529;
        --fg-secondary: #495057;
        --accent: #5c4ee5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1b1e;
          --fg: #e9ecef;
          --fg-secondary: #adb5bd;
          --accent: #8b7cf8;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        color: var(--fg-secondary);
      }
      a {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <p>This page could not be found.</p>
    <a href="/">Back to Mentis</a>
  </body>
</html>
