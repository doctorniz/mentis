[package]
name = "mentis-folders"
version = "0.1.0"
description = "Mentis on iOS: the Files folder picker, and access to picked folders across launches"
license = "BUSL-1.1"
edition = "2024"
rust-version = "1.90"
publish = false
# Tauri's build step links the Swift package named after the crate.
links = "mentis-folders"

[dependencies]
tauri = "2.12.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-plugin = { version = "2.7.1", features = ["build"] }
