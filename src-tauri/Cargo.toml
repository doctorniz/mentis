[package]
name = "mentis"
version = "0.1.0"
description = "Mentis: a local-first personal knowledge system"
license = "BUSL-1.1"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the library and binary names apart (a Cargo issue on Windows).
name = "mentis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
strsim = "0.11.1"
regex = "1.13.1"
notify = "8.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }
