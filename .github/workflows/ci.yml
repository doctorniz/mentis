name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # `pnpm test --run` breaks under pnpm 9 (it parses --run as a pnpm
      # option: "Unknown option: 'run'"). Use the dedicated script.
      - run: pnpm test:run

      - run: pnpm build

      # Size budgets from perf-budgets.json (CLAUDE.md). Fails on an
      # enforced budget; never raise one to make this pass.
      - run: pnpm budgets

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer serves this static export in CI
      # (playwright.config.ts switches from `pnpm dev` on CI).
      - run: pnpm build

      # Both projects: the full chromium suite + the Pixel 5 mobile spec
      - run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rust format, lint and tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Builds the web bundle (desktop mode) and the NSIS installer.
      - run: pnpm exec tauri build --bundles nsis

      # Release binary against the 15 MB budget in perf-budgets.json.
      - run: pnpm budgets:binary

      # Report-only until real numbers exist on this runner; then it is
      # enforced by a separate commit that sets timingEnforce.
      - name: Desktop cold start
        continue-on-error: true
        run: pnpm budgets:cold-start

      - uses: actions/upload-artifact@v4
        with:
          name: mentis-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
