name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # `pnpm test --run` breaks under pnpm 9 (it parses --run as a pnpm
      # option: "Unknown option: 'run'"). Use the dedicated script.
      - run: pnpm test:run

      - run: pnpm build

      # Size budgets from perf-budgets.json (CLAUDE.md). Fails on an
      # enforced budget; never raise one to make this pass.
      - run: pnpm budgets

  # Known vulnerabilities in dependencies (docs/DEPLOYMENT.md, Audits).
  # Rust fails the build. npm only reports for now: most of its findings are
  # in Node-only code that never ships (Next.js through slidecanvas, tar).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: npm audit (report only)
        run: |
          set +e
          pnpm audit --prod --audit-level high | tee audit.txt
          status=${PIPESTATUS[0]}
          {
            echo '## npm audit (production dependencies)'
            tail -n 2 audit.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit found high or critical advisories (see this step's log)."
          fi

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2

      - name: cargo audit
        working-directory: src-tauri
        run: |
          command -v cargo-audit || cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer serves this static export in CI
      # (playwright.config.ts switches from `pnpm dev` on CI).
      - run: pnpm build

      # Both projects: the full chromium suite + the Pixel 5 mobile spec
      - run: pnpm exec playwright test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rust format, lint and tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Builds the web bundle (desktop mode) and the NSIS installer.
      - run: pnpm exec tauri build --bundles nsis

      # Release binary against the 15 MB budget in perf-budgets.json.
      - run: pnpm budgets:binary

      # Report-only until real numbers exist on this runner; then it is
      # enforced by a separate commit that sets timingEnforce.
      - name: Desktop cold start
        continue-on-error: true
        run: pnpm budgets:cold-start

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mentis-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  # The phone-only code (Rust under cfg(mobile), the Kotlin in gen/android)
  # is compiled nowhere else. An unsigned 64-bit ARM build is enough to catch
  # breakage; releases build every CPU type (android-release.yml).
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android NDK and Rust target
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-android-

      - run: pnpm exec tauri android build --ci --target aarch64 --apk

  # The iOS app, built for the simulator and launched there; a screenshot of
  # its first screen is kept. Nothing else compiles the iOS-only code (Rust
  # under cfg(target_os = "ios"), the Swift in src-tauri/plugins).
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rust targets and XcodeGen
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-ios-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-ios-

      # The Xcode project (src-tauri/gen/apple) is made once by `tauri ios init`
      # on a Mac and committed; until it is, make it here.
      - name: Xcode project
        run: test -d src-tauri/gen/apple || pnpm exec tauri ios init --ci

      - run: pnpm exec tauri ios build --ci --debug --target aarch64-sim

      - name: Launch in the simulator
        run: |
          APP=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -type d -name '*.app' -path '*iphonesimulator*' 2> /dev/null | head -1)
          test -n "$APP" || { echo "no simulator app built"; exit 1; }
          echo "app: $APP"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" app.mentis
          sleep 20
          xcrun simctl io "$DEVICE" screenshot ios-first-screen.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep -q 'app.mentis' || { echo "the app is not running"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-first-screen
          path: ios-first-screen.png
          if-no-files-found: ignore
          retention-days: 14

      # A project made here, to commit if none is yet.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-xcode-project
          path: |
            src-tauri/gen/apple
            !src-tauri/gen/apple/build
            !src-tauri/gen/apple/Externals
          if-no-files-found: ignore
          retention-days: 7
