name: Android release

# Push a version tag (v0.2.0) to build the Play bundle and an APK, signed with
# the upload key, and attach them to a GitHub release. Upload the .aab in the
# Play Console. Setup: docs/ANDROID.md, "Releasing".
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The tag names the app's version
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Android NDK and Rust targets
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      # No caches: a signed release builds only from what this run fetched.
      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set (docs/ANDROID.md, Releasing)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Dropbox app key
        env:
          NEXT_PUBLIC_DROPBOX_CLIENT_ID: ${{ vars.NEXT_PUBLIC_DROPBOX_CLIENT_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_DROPBOX_CLIENT_ID" ]; then
            echo "::error::The NEXT_PUBLIC_DROPBOX_CLIENT_ID variable is not set (docs/ANDROID.md, Releasing)."
            exit 1
          fi

      - name: Build the signed bundle and APK (all four CPU types)
        env:
          NEXT_PUBLIC_DROPBOX_CLIENT_ID: ${{ vars.NEXT_PUBLIC_DROPBOX_CLIENT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm exec tauri android build --ci --aab --apk

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=src-tauri/gen/android/app/build/outputs
          cp "$out/bundle/universalRelease/app-universal-release.aab" "mentis-$GITHUB_REF_NAME.aab"
          cp "$out/apk/universal/release/app-universal-release.apk" "mentis-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" --title "Mentis $GITHUB_REF_NAME" --generate-notes \
            "mentis-$GITHUB_REF_NAME.aab" "mentis-$GITHUB_REF_NAME.apk"
