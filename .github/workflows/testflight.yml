name: TestFlight

# Builds the iPhone and iPad app, signs it for the App Store and uploads it to
# TestFlight. Run it by hand (Actions › TestFlight › Run workflow) or push a tag
# like ios-v0.1.3. It is not part of the release workflow, so an iOS problem
# never holds back the desktop and Android builds. Setup: docs/DEPLOYMENT.md,
# "TestFlight".
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

permissions:
  contents: read

# No caches: a signed build uses only what its run fetched.
jobs:
  testflight:
    # App Store Connect takes only builds made with the iOS 26 SDK or later
    # (Xcode 26); macos-15 defaults to Xcode 16.
    runs-on: macos-26
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Xcode 26 or later
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2> /dev/null | grep -v -i beta | sort -V | tail -1)
          test -n "$XCODE" || { echo "::error::No Xcode 26 or later on this runner."; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # The version is package.json's packageManager.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Secrets are set
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_IOS_API_KEY: ${{ secrets.APPLE_IOS_API_KEY }}
          APPLE_IOS_API_KEY_CONTENT: ${{ secrets.APPLE_IOS_API_KEY_CONTENT }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          for v in APPLE_DEVELOPMENT_TEAM APPLE_API_ISSUER APPLE_IOS_API_KEY APPLE_IOS_API_KEY_CONTENT \
                   IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION; do
            if [ -z "${!v}" ]; then
              echo "::error::The secret behind $v is not set (docs/DEPLOYMENT.md, TestFlight)."
              exit 1
            fi
          done

      - name: Rust targets and XcodeGen
        run: |
          rustup target add aarch64-apple-ios
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen

      - name: Xcode project
        run: test -d src-tauri/gen/apple || pnpm exec tauri ios init --ci

      # Signed with the Apple Distribution certificate and the App Store
      # profile for ink.mentis.app, which Tauri installs from these variables.
      # Cloud signing is not used: Apple allows it only to Admin API keys, and
      # even those fail at times. Each upload needs a build number above the
      # last: the run number.
      - name: Build and sign
        env:
          NEXT_PUBLIC_DROPBOX_CLIENT_ID: ${{ vars.NEXT_PUBLIC_DROPBOX_CLIENT_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          pnpm exec tauri ios build --ci --export-method app-store-connect \
            --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"${GITHUB_RUN_NUMBER}\"}}}"

      # The App Store Connect key uploads the build; altool looks for it in
      # ~/.private_keys.
      - name: Upload to TestFlight
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_IOS_API_KEY: ${{ secrets.APPLE_IOS_API_KEY }}
          APPLE_IOS_API_KEY_CONTENT: ${{ secrets.APPLE_IOS_API_KEY_CONTENT }}
        run: |
          IPA=$(find src-tauri/gen/apple -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::No .ipa was built."; exit 1; }
          mkdir -p ~/.private_keys
          printf '%s\n' "$APPLE_IOS_API_KEY_CONTENT" > ~/.private_keys/AuthKey_${APPLE_IOS_API_KEY}.p8
          echo "uploading $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPLE_IOS_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove the key
        if: always()
        run: rm -rf ~/.private_keys
