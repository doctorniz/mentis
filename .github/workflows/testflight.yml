name: TestFlight

# Builds the iPhone and iPad app, signs it for the App Store and uploads it to
# TestFlight. Run it by hand (Actions › TestFlight › Run workflow) or push a tag
# like ios-v0.1.3. It is not part of the release workflow, so an iOS problem
# never holds back the desktop and Android builds. Setup: docs/DEPLOYMENT.md,
# "TestFlight".
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

permissions:
  contents: read

# No caches: a signed build uses only what its run fetched.
jobs:
  testflight:
    runs-on: macos-15
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_IOS_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The version is package.json's packageManager.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Secrets are set
        env:
          APPLE_IOS_API_KEY_CONTENT: ${{ secrets.APPLE_IOS_API_KEY_CONTENT }}
        run: |
          for v in APPLE_DEVELOPMENT_TEAM APPLE_API_ISSUER APPLE_API_KEY APPLE_IOS_API_KEY_CONTENT; do
            if [ -z "${!v}" ]; then
              echo "::error::The secret behind $v is not set (docs/DEPLOYMENT.md, TestFlight)."
              exit 1
            fi
          done

      - name: Rust targets and XcodeGen
        run: |
          rustup target add aarch64-apple-ios
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen

      # The App Store Connect key signs the build (Xcode makes the certificate
      # and profile) and uploads it; altool looks for it in ~/.private_keys.
      - name: App Store Connect key
        env:
          APPLE_IOS_API_KEY_CONTENT: ${{ secrets.APPLE_IOS_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.private_keys
          printf '%s\n' "$APPLE_IOS_API_KEY_CONTENT" > ~/.private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/.private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Xcode project
        run: test -d src-tauri/gen/apple || pnpm exec tauri ios init --ci

      # Each upload needs a build number above the last: the run number.
      - name: Build and sign
        env:
          NEXT_PUBLIC_DROPBOX_CLIENT_ID: ${{ vars.NEXT_PUBLIC_DROPBOX_CLIENT_ID }}
        run: |
          pnpm exec tauri ios build --ci --export-method app-store-connect \
            --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"${GITHUB_RUN_NUMBER}\"}}}"

      - name: Upload to TestFlight
        run: |
          IPA=$(find src-tauri/gen/apple -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::No .ipa was built."; exit 1; }
          echo "uploading $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove the key
        if: always()
        run: rm -rf ~/.private_keys
