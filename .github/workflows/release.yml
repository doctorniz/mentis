name: Release

# Push a version tag (v0.2.0) to build Mentis for Windows, macOS, Linux and
# Android and publish them as one GitHub release. The release stays a draft
# until every build has attached its files. Setup: docs/DEPLOYMENT.md,
# "Releasing"; the Android key: docs/ANDROID.md, "Releasing".
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

# No caches anywhere: a signed release builds only from what its run fetched.
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The tag names the app's version
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - name: Dropbox app key
        env:
          NEXT_PUBLIC_DROPBOX_CLIENT_ID: ${{ vars.NEXT_PUBLIC_DROPBOX_CLIENT_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_DROPBOX_CLIENT_ID" ]; then
            echo "::error::The NEXT_PUBLIC_DROPBOX_CLIENT_ID variable is not set (docs/DEPLOYMENT.md, Releasing)."
            exit 1
          fi

      # A re-run finds the draft it made the first time.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "Mentis $GITHUB_REF_NAME" --generate-notes

  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          # One app for Apple silicon and Intel Macs.
          - os: macos-15
            args: --target universal-apple-darwin --bundles dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # The oldest supported Ubuntu, so the AppImage runs on older systems too.
          - os: ubuntu-22.04
            args: --bundles appimage,deb
            files: src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The version is package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Rust targets for both kinds of Mac
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Signed with the Developer ID and notarized once the Apple secrets are
      # set; until then signed ad hoc, which macOS lets a person open from
      # System Settings › Privacy & Security.
      - name: Mac signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::The Apple secrets are not set: the Mac app is not notarized (docs/DEPLOYMENT.md, Releasing)."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Build
        env:
          NEXT_PUBLIC_DROPBOX_CLIENT_ID: ${{ vars.NEXT_PUBLIC_DROPBOX_CLIENT_ID }}
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber

  android:
    needs: draft
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The version is package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android NDK and Rust targets
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set (docs/ANDROID.md, Releasing)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the signed bundle and APK (all four CPU types)
        env:
          NEXT_PUBLIC_DROPBOX_CLIENT_ID: ${{ vars.NEXT_PUBLIC_DROPBOX_CLIENT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm exec tauri android build --ci --aab --apk

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=src-tauri/gen/android/app/build/outputs
          cp "$out/bundle/universalRelease/app-universal-release.aab" "mentis-$GITHUB_REF_NAME.aab"
          cp "$out/apk/universal/release/app-universal-release.apk" "mentis-$GITHUB_REF_NAME.apk"
          gh release upload "$GITHUB_REF_NAME" "mentis-$GITHUB_REF_NAME.aab" "mentis-$GITHUB_REF_NAME.apk" --clobber

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
